<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário de Estudos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Cabeçalho & Cronómetro -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center space-y-4">
      <h1 class="text-2xl font-bold text-blue-400">⏱️ Diário de Estudos (Sincronizado)</h1>
      <div id="display" class="text-5xl font-mono font-bold tracking-wider text-emerald-400">00:00:00</div>
      <button id="timerBtn" onclick="toggleTimer()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition">
        Iniciar Estudo
      </button>
    </div>

    <!-- Formulário de Registo -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
      <h2 class="text-xl font-semibold">Registar Sessão</h2>
      <div>
        <label class="block text-sm text-slate-400 mb-1">O que estudou hoje?</label>
        <input type="text" id="materia" placeholder="Ex: Java, Redes, Azure..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Meta Planeada (Horas)</label>
          <input type="number" id="meta" value="2" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Tempo Estudado (Horas)</label>
          <input type="number" id="tempo" step="0.01" placeholder="Ex: 1.5" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">
        </div>
      </div>
      <button onclick="salvarSessao()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded transition">
        Guardar na Nuvem
      </button>
    </div>

    <!-- Histórico de Estudos -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
      <h2 class="text-xl font-semibold">Histórico de Estudos</h2>
      <div id="historico" class="space-y-2 max-h-60 overflow-y-auto">
        <p class="text-slate-400 text-sm">A carregar dados do Firebase...</p>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC0rK78NwUU7GUqq9Vwfywfw3gBeOrbJ-w",
      authDomain: "diario-estudos-app.firebaseapp.com",
      projectId: "diario-estudos-app",
      storageBucket: "diario-estudos-app.firebasestorage.app",
      messagingSenderId: "736000609268",
      appId: "1:736000609268:web:08ac8c9b183274839ac7a1"
    };

    try {
      firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore();
    } catch (err) {
      document.getElementById('historico').innerHTML = `<p class="text-rose-400 text-sm">Erro de Inicialização: ${err.message}</p>`;
    }

    let timer = null;
    let seconds = 0;

    function toggleTimer() {
      const btn = document.getElementById('timerBtn');
      if (timer) {
        clearInterval(timer);
        timer = null;
        btn.innerText = 'Iniciar Estudo';
        btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition';
        document.getElementById('tempo').value = (seconds / 3600).toFixed(2);
      } else {
        timer = setInterval(() => {
          seconds++;
          const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
          const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
          const s = String(seconds % 60).padStart(2, '0');
          document.getElementById('display').innerText = `${h}:${m}:${s}`;
        }, 1000);
        btn.innerText = 'Pausar / Finalizar';
        btn.className = 'bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition';
      }
    }

    async function salvarSessao() {
      const materia = document.getElementById('materia').value;
      const meta = parseFloat(document.getElementById('meta').value) || 0;
      const tempo = parseFloat(document.getElementById('tempo').value) || 0;

      if (!materia) {
        alert('Por favor, informe a matéria estudada.');
        return;
      }

      try {
        await db.collection('estudos').add({
          materia: materia,
          meta: meta,
          tempo: tempo,
          data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR')
        });

        document.getElementById('materia').value = '';
        document.getElementById('tempo').value = '';
        seconds = 0;
        document.getElementById('display').innerText = '00:00:00';
      } catch (e) {
        alert('Erro ao guardar no Firebase: ' + e.message);
      }
    }

    // Leitura dos dados
    if (db) {
      db.collection('estudos').onSnapshot((snapshot) => {
        const container = document.getElementById('historico');
        if (snapshot.empty) {
          container.innerHTML = '<p class="text-slate-400 text-sm">Nenhum registo encontrado.</p>';
          return;
        }
        
        container.innerHTML = '';
        snapshot.forEach((doc) => {
          const item = doc.data();
          const div = document.createElement('div');
          div.className = 'bg-slate-900 p-3 rounded flex justify-between items-center text-sm border border-slate-700';
          div.innerHTML = `
            <div>
              <div class="font-bold text-blue-400">${item.materia}</div>
              <div class="text-xs text-slate-400">${item.data || ''}</div>
            </div>
            <div class="text-right">
              <span class="text-emerald-400 font-mono font-bold">${item.tempo}h</span> / <span class="text-slate-400">${item.meta}h meta</span>
            </div>
          `;
          container.appendChild(div);
        });
      }, (error) => {
        document.getElementById('historico').innerHTML = `<p class="text-rose-400 text-sm">Erro ao ligar ao Firestore: ${error.message}</p>`;
      });
    }
  </script>
</body>
</html>
